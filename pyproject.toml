[project]
name = "beacon-training-matrix"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36",
    "supabase>=2.5",
    "resend>=2.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "freezegun>=1.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["beacon*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
